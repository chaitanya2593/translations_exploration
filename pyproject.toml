
[project]
name = "explore-translation-approaches"
version = "0.1.0"
description = "The objective of the project is to explore different exploration approaches. Use the Automatic metrics to understand to gauge the approaches. We try to use the news commentary corpus to understand the different approaches to translation. The language should be german to english."
requires-python = ">=3.13"



dependencies = [
    # basic EDA packages
    "pandas>=2.3.2",
    "scikit-learn>=1.4.1",
    "matplotlib>=3.10.5",
    "seaborn==0.13.2",

    # streamlit
    "streamlit>=1.49.1",
    "watchdog==4.0.0",
    "llama-cpp-python==0.3.7",
    "huggingface-hub"


]


[dependency-groups]
research = [
    # NLP packages
    "openpyxl==3.1.2",

    "transformers==4.48.0",
    "accelerate==1.3.0",
    "sentencepiece==0.2.0",
    "tiktoken==0.8.0",
    "blobfile==3.0.0",
    "torch==2.5.1",
    "sacrebleu==2.5.1",
    "unbabel-comet==2.2.4",
    "evaluate==0.4.3",

]